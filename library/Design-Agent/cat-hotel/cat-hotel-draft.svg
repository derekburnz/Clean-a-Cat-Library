<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1200" height="620" fill="#FFF6EC"/>
<text x="30" y="44" font-size="26" fill="#45226B" font-weight="700">Cat Hotel draft: the room from above, and the stay card</text>
<!-- floor plan -->
<g transform="translate(30,70)">
<rect width="560" height="520" rx="26" fill="#F3E6FF" stroke="#45226B" stroke-width="5"/>
<rect x="230" y="505" width="100" height="20" fill="#FFF6EC" stroke="#45226B" stroke-width="4"/>
<text x="280" y="500" font-size="16" text-anchor="middle" fill="#45226B">back door (from the spa)</text>
<!-- desk -->
<rect x="200" y="380" width="160" height="60" rx="16" fill="#FFC94D" stroke="#45226B" stroke-width="4"/>
<circle cx="335" cy="395" r="10" fill="#FFF" stroke="#45226B" stroke-width="3"/>
<text x="270" y="418" font-size="20" text-anchor="middle" fill="#45226B">Front desk</text>
<text x="280" y="468" font-size="15" text-anchor="middle" fill="#45226B">guest waits here with a suitcase</text>
<!-- rooms -->
<g font-size="18" fill="#45226B" text-anchor="middle">
<rect x="20" y="20" width="160" height="150" rx="18" fill="#FFD6E7" stroke="#45226B" stroke-width="4"/>
<ellipse cx="100" cy="110" rx="52" ry="30" fill="#FFF" stroke="#45226B" stroke-width="3"/><text x="100" y="50">Room 1</text><text x="100" y="116" font-size="13">asleep · 3h 12m</text>
<rect x="200" y="20" width="160" height="150" rx="18" fill="#D6F0FF" stroke="#45226B" stroke-width="4"/>
<ellipse cx="280" cy="110" rx="52" ry="30" fill="#FFF" stroke="#45226B" stroke-width="3"/><text x="280" y="50">Room 2</text>
<circle cx="320" cy="80" r="18" fill="#FFC94D" stroke="#45226B" stroke-width="3"/><text x="320" y="86" font-size="16">$</text><text x="280" y="117" font-size="15">ready! tap</text>
<rect x="380" y="20" width="160" height="150" rx="18" fill="#EEE" stroke="#45226B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="460" y="80">Room 3</text><text x="460" y="108" font-size="15">locked · Build board</text><text x="460" y="130" font-size="15">3,000 coins</text>
<rect x="20" y="200" width="160" height="150" rx="18" fill="#EEE" stroke="#45226B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="100" y="260">Room 4</text><text x="100" y="288" font-size="15">locked · 8,000 coins</text>
</g>
<text x="420" y="300" font-size="16" fill="#45226B" text-anchor="middle">plants, lamps, a rug</text>
</g>
<!-- stay card -->
<g transform="translate(640,90)">
<rect width="530" height="480" rx="26" fill="#FFF6EC" stroke="#45226B" stroke-width="5"/>
<rect x="0" y="0" width="530" height="70" rx="22" fill="#F6A9C9"/>
<circle cx="42" cy="35" r="24" fill="#FFF6EC" stroke="#45226B" stroke-width="4"/><text x="42" y="44" font-size="24" text-anchor="middle">🛏</text>
<text x="80" y="46" font-size="30" fill="#FFF" stroke="#45226B" stroke-width="1.5" font-weight="700">Book a stay</text>
<circle cx="80" cy="130" r="40" fill="#D6F0FF" stroke="#45226B" stroke-width="4"/><text x="80" y="142" font-size="36" text-anchor="middle">🐱</text>
<text x="140" y="122" font-size="24" fill="#45226B" font-weight="700">Biscuit wants a room</text>
<text x="140" y="150" font-size="18" fill="#7A5A99">Rare guest · pays ×1.5</text>
<g font-size="22" fill="#45226B" text-anchor="middle">
<rect x="20" y="195" width="150" height="120" rx="20" fill="#FFF" stroke="#45226B" stroke-width="4"/><text x="95" y="240" font-weight="700">1 hour</text><text x="95" y="280">90 coins</text>
<rect x="190" y="195" width="150" height="120" rx="20" fill="#FFF" stroke="#45226B" stroke-width="4"/><text x="265" y="240" font-weight="700">4 hours</text><text x="265" y="280">300 coins</text>
<rect x="360" y="195" width="150" height="120" rx="20" fill="#5BCB8A" stroke="#45226B" stroke-width="4"/><text x="435" y="240" font-weight="700" fill="#FFF">8 hours</text><text x="435" y="280" fill="#FFF">540 coins</text>
</g>
<text x="435" y="336" font-size="15" fill="#45226B" text-anchor="middle">best before bed</text>
<text x="20" y="378" font-size="18" fill="#45226B" font-weight="700">Thank you gift chances (8 hours)</text>
<text x="20" y="406" font-size="18" fill="#7A5A99">Bonus coins 65% · A bow 23% · A crate 12%</text>
<text x="20" y="446" font-size="16" fill="#7A5A99">The guest pays when the stay ends, even while you are away.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
