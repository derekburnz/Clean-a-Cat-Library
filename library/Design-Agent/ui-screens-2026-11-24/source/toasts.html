<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="states" content="toasts,single,praise-great,praise-awesome,praise">
<title>Toasts and praise</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/* The small messages. Two kinds, and neither is ever a box over the middle of the screen.

   TOASTS (states toasts, single): one line each with a round picture, in the message slot at the top centre under
   the goal line. At most two show at once; a third waits until the oldest has gone (about 3 seconds each).
   A toast is a flat ink pill with no lip. Everything pressable in the kit is light with a lip, and HUD status is
   outlined words, so the dark pill reads as a passing note and as neither of those. (Outlined words with no pill
   were tried first: three outlined lines under each other read as one block with the goal line.)
   Repeats are added up ("Helpers finished 3 cats: +90") instead of sent one by one, and toasts wait while a cat is
   being washed or a window is open.
   On narrow phones the top centre is taken by the four HUD buttons and the level bar, so the slot docks to the
   right edge under the coins (body.narrow, set below when the design width is under 1060).

   PRAISE (states praise-great, praise-awesome, praise): one word beside the cat while washing, with the combo
   count under it. The word and the count get bigger and warmer as the combo climbs: white "Great!" from x3, mint
   "Awesome!" from x7, pink "Sparkling!" with sparkles from x12. A new word replaces the old one, so only one
   shows at a time, and it is outlined words on the world with no box. */

/* ---------- the HUD, copied from hud.html ---------- */
.top { position: absolute; top: calc(58px / var(--s) + 6px); }
.goal { left: 50%; transform: translateX(-50%); top: 14px; display: flex; align-items: center; gap: 10px; font-size: 30px; white-space: nowrap; }
.goal .step { font-size: 22px; color: #ffe98f; }
.goal .ic { font-size: 34px; }
.money { right: 22px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.money .coins { display: flex; align-items: center; gap: 8px; font-size: 46px; line-height: 1; }
.money .coins .ic { font-size: 48px; }
.lvl { display: flex; align-items: center; gap: 8px; }
.lvl .lv { font-family: var(--font-head); font-size: 18px; color: #fff; background: #a45be6; border: 3px solid var(--ink); border-radius: 14px; height: 30px; padding: 0 10px; display: grid; place-items: center; }
.lvl .xpb { width: 150px; height: 20px; }
.friends { display: flex; align-items: center; gap: 6px; font-size: 20px; }
.friends .ic { font-size: 28px; }
.side { left: 20px; margin-top: 18px; display: grid; grid-template-columns: repeat(2, 76px); gap: 40px 16px; }
.queue { position: absolute; right: 26px; top: 54%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.queue .head { font-family: var(--font-head); font-size: 20px; }
.qface { position: relative; width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--ink); background: #fff4e6; overflow: visible; box-shadow: 0 5px 0 var(--ink); }
.qface img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.qface .pat { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); transform: rotate(-90deg); overflow: visible; }
.qface .pat circle { fill: none; stroke-width: 8; }
.qface .pat .trk { stroke: rgba(255,255,255,.85); }
.qface .pat .val { stroke: var(--c, #3fa868); stroke-linecap: round; }
.qface .rar { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); height: 24px; font-size: 16px; padding: 0 9px; }
.qmore { font-family: var(--font-head); font-size: 18px; }
.prompt { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; }
.key { min-width: 48px; height: 48px; padding: 0 10px; border-radius: 12px; border: 4px solid var(--ink); background: #fff; display: grid; place-items: center;
  font-family: var(--font-head); font-size: 22px; box-shadow: 0 4px 0 var(--ink); }
body.touch .key { display: none; }
body.short .side { grid-template-columns: repeat(4, 66px); gap: 0 14px; }
body.short .side .rbtn { width: 66px; height: 66px; font-size: 38px; border-radius: 20px; }
body.short .queue { top: calc(58px / var(--s) + 122px); transform: none; flex-direction: row-reverse; gap: 22px; right: 30px; }
body.short .qmore { align-self: center; }
body.short .qface { width: 60px; height: 60px; }
body.short .qface .pat { inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); }
body.short .money { flex-direction: column; gap: 4px; }
body.short .lvl .xpb { width: 120px; }
body.short .queue .head { display: none; }

/* ---------- toasts ---------- */
/* a flat ink pill with no lip: every pressable thing in the kit is light with a lip, so this does not read as a button */
.toasts { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
.toast { position: relative; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 20px 1px 54px; border-radius: 21px;
  background: rgba(69, 34, 107, .93); color: #fff; font-family: var(--font-head); font-size: 22px; white-space: nowrap; box-shadow: 0 3px 0 rgba(36, 16, 56, .3); }
.toast .med { position: absolute; left: -4px; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--ink);
  background: #fff; box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; font-size: 32px; overflow: hidden; }
.toast .shot { position: absolute; inset: 0; transform: scale(1.6); transform-origin: 34% 17%; }  /* close on the face */
.toast .shot img, .toast .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.toast .med.face { background: #fff4e6; }
.toast .gain { color: #ffe14a; display: inline-flex; align-items: center; gap: 5px; }
.toast .gain .ic { font-size: 26px; }
/* narrow phones: the slot docks under the coins and the level bar, lined up with the right edge */
body.narrow .toasts { left: auto; right: 22px; transform: none; top: calc(58px / var(--s) + 27px); align-items: flex-end; gap: 8px; }
body.narrow .toast { height: 36px; font-size: 20px; padding: 0 16px 1px 46px; border-radius: 18px; }
body.narrow .toast .med { width: 42px; height: 42px; font-size: 27px; box-shadow: 0 2px 0 var(--ink); }
body.narrow .toast .gain .ic { font-size: 23px; }

/* ---------- the wash view behind the praise, copied from wash.html (scrub step) ---------- */
.world.wash { background: radial-gradient(ellipse at 50% 40%, #fbe6cf, #f2d2b0); }
.scene { position: absolute; left: 50%; top: calc(50% + 10px); height: 92%; aspect-ratio: 1040 / 820; transform: translate(-50%, -50%); }
.scene > img { width: 100%; height: 100%; display: block;
  /* fade the picture's edges into the backdrop so no seam shows on wide screens */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent), linear-gradient(transparent, #000 6%, #000 94%, transparent);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.steps { position: absolute; left: 50%; top: calc(58px / var(--s) + 8px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.steps .t { font-family: var(--font-head); font-size: 30px; white-space: nowrap; }
.steps .t b { font-weight: 400; color: #ffe98f; }
.pips { display: flex; gap: 10px; }
.pip { position: relative; width: 50px; height: 50px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; display: grid; place-items: center; font-size: 30px; box-shadow: 0 4px 0 var(--ink); }
.pip.now { background: #ffe98f; transform: scale(1.18); }
.pip.next { opacity: .75; }
.task { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.task .say { font-family: var(--font-head); font-size: 30px; white-space: nowrap; }
.task .bar { width: 380px; height: 24px; }
.tray { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 12px; padding: 10px 14px; border-radius: 24px;
  background: rgba(255, 246, 236, .92); border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
.slot { position: relative; width: 72px; height: 72px; border-radius: 18px; border: 4px solid var(--ink); background: #fff; display: grid; place-items: center; font-size: 46px; }
.slot.sel { background: linear-gradient(#ffe98f, #ffc94d); transform: translateY(-10px); box-shadow: 0 6px 0 var(--ink); }
.slot .k { position: absolute; left: 6px; top: 2px; font-family: var(--font-head); font-size: 15px; }
body.touch .slot .k { display: none; }
.turn { position: absolute; top: 50%; transform: translateY(-50%); }
.turn.l { left: 26px; } .turn.r { right: 26px; }
.turn .rbtn { width: 84px; height: 84px; border-radius: 50%; font-size: 40px; }
.turn svg { width: 46px; height: 46px; }
.stop { position: absolute; left: 20px; top: calc(58px / var(--s) + 14px); }
.wcoins { position: absolute; right: 22px; top: calc(58px / var(--s) + 12px); display: flex; align-items: center; gap: 8px; font-size: 40px; }
.wcoins .ic { font-size: 42px; }
body.short .task { bottom: 112px; }
body.short .task .say { font-size: 26px; }
body.short .task .bar { width: 300px; height: 20px; }
body.short .slot { width: 64px; height: 64px; font-size: 40px; }
body.short .tray { gap: 10px; padding: 8px 12px; }
body.short .pip { width: 44px; height: 44px; font-size: 26px; }
body.short .steps .t { font-size: 26px; }
body.short .turn .rbtn { width: 76px; height: 76px; }

/* ---------- praise ---------- */
/* Placed on the wash picture itself (.scene), up and to the right of the cat, so it follows the cat on every screen.
   Big words get a real ring (text stroke painted under the fill) and a drop, like the kit's .outlined but thicker. */
.praise { position: absolute; left: 70%; top: 26%; transform: rotate(-7deg); transform-origin: 0 50%; display: flex; flex-direction: column; align-items: flex-start;
  font-size: var(--w); pointer-events: none; }
.pw, .px { position: relative; font-family: var(--font-head); line-height: 1; white-space: nowrap;
  -webkit-text-stroke: var(--ring) var(--ink); paint-order: stroke fill; text-shadow: 0 var(--drop) 0 var(--ink); }
.pw { font-size: 1em; letter-spacing: .02em; color: var(--fill); }
.px { font-size: var(--x); color: #ffe14a; margin: -.1em 0 0 calc(var(--w) * 1.05); transform: rotate(4deg); }
.px small { font-size: .72em; margin-right: .04em; }
.praise .ic { position: absolute; }
.praise .s1 { left: calc(var(--w) * -.3); top: calc(var(--w) * -.22); font-size: .56em; }
.praise .s2 { right: calc(var(--w) * -.2); top: calc(var(--w) * -.24); font-size: .4em; }
.praise .s3 { left: calc(var(--w) * 3.05); top: calc(var(--w) * 1.42); font-size: .34em; }
.praise.great   { --w: 46px; --x: 34px; --ring: 9px;  --drop: 4px; --fill: #ffffff; }
.praise.awesome { --w: 56px; --x: 46px; --ring: 10px; --drop: 5px; --fill: #b4f7d5; }
.praise.spark   { --w: 66px; --x: 58px; --ring: 12px; --drop: 6px; --fill: #ffb6dd; }
body.short .praise { left: 69%; top: 36%; transform: rotate(-5deg); }
.praise.spark { left: 73%; }
body.short .praise.spark { left: 72%; }
body.short .praise.great   { --w: 36px; --x: 28px; --ring: 7px; --drop: 3px; }
body.short .praise.awesome { --w: 42px; --x: 36px; --ring: 8px; --drop: 4px; }
body.short .praise.spark   { --w: 44px; --x: 42px; --ring: 9px; --drop: 4px; }
</style>
</head>
<body>
<div id="screen"><div id="stage">
  <!-- walking around the spa: the HUD from hud.html, for the toasts -->
  <div class="world spa" data-only="toasts single" style="background-image:url(img/world-spa.jpg)"></div>

  <div class="top goal outlined" data-only="toasts single"><i data-ic="paw"></i><span>Wash 3 cats</span><span class="step">1 / 3</span></div>

  <div class="top money" data-only="toasts single">
    <div class="coins outlined"><i data-ic="coin"></i><span class="num">1,240</span></div>
    <div class="lvl"><div class="friends outlined thin"><i data-ic="friends"></i><span>+10%</span></div><span class="lv">Lv 4</span><div class="bar xpb"><i style="width:62%;background:linear-gradient(#e2c6ff,#a45be6)"></i></div></div>
  </div>

  <div class="top side" data-only="toasts single">
    <button class="rbtn mint" data-tap aria-label="Cat Index"><i data-ic="book"></i><span class="cap outlined thin">Index</span><span class="dot">2</span></button>
    <button class="rbtn sky" data-tap aria-label="Tools"><i data-ic="tools"></i><span class="cap outlined thin">Tools</span></button>
    <button class="rbtn pink" data-tap aria-label="Helpers"><i data-ic="helper"></i><span class="cap outlined thin">Helpers</span></button>
    <button class="rbtn gold" data-tap aria-label="Builder"><i data-ic="hammer"></i><span class="cap outlined thin">Build</span><span class="dot">!</span></button>
  </div>

  <div class="queue" data-only="toasts single">
    <span class="head outlined thin">Waiting</span>
    <button class="qface" data-tap aria-label="Muffin, waiting"><svg class="pat" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="45"/><circle class="val" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="85 100"/></svg><img src="img/Cat_Muffin_Dirty_Sit.png" alt=""></button>
    <button class="qface" data-tap aria-label="Toffee, rare, waiting"><svg class="pat" viewBox="0 0 100 100" style="--c:#ff9d1f"><circle class="trk" cx="50" cy="50" r="45"/><circle class="val" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="45 100"/></svg><img src="img/Cat_Toffee_Dirty_Sit.png" alt=""><span class="rar rare">Rare</span></button>
    <span class="qmore outlined thin">+1 more</span>
  </div>

  <div class="prompt" data-only="toasts single"><span class="key">E</span><span class="outlined" style="font-family:var(--font-head);font-size:26px">Take next cat</span></div>

  <!-- washing a cat: the scrub step from wash.html, for the praise -->
  <div class="world wash" data-only="praise praise-awesome praise-great"><div class="scene"><img src="img/wash-close.jpg" alt=""></div></div>
  <button class="btn ghost small stop" data-tap data-only="praise praise-awesome praise-great"><span class="lbl">Stop</span></button>
  <div class="wcoins outlined" data-only="praise praise-awesome praise-great"><i data-ic="coin"></i><span>1,240</span></div>
  <div class="steps" data-only="praise praise-awesome praise-great">
    <span class="t outlined">Step 1 of 4 · <b>Scrub the mud</b></span>
    <div class="pips"><span class="pip now"><i data-ic="sponge"></i></span><span class="pip next"><i data-ic="tweezers"></i></span><span class="pip next"><i data-ic="shower"></i></span><span class="pip next"><i data-ic="clipper"></i></span></div>
  </div>
  <div class="turn l" data-only="praise praise-awesome praise-great"><button class="rbtn lilac" data-tap aria-label="Turn left"><svg viewBox="0 0 64 64"><path d="M40 14a20 20 0 1 1-22 6" fill="none" stroke="#45226b" stroke-width="9" stroke-linecap="round"/><path d="M40 14a20 20 0 1 1-22 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M8 14l14 2-4 14z" fill="#fff" stroke="#45226b" stroke-width="4" stroke-linejoin="round"/></svg></button></div>
  <div class="turn r" data-only="praise praise-awesome praise-great"><button class="rbtn lilac" data-tap aria-label="Turn right"><svg viewBox="0 0 64 64" style="transform:scaleX(-1)"><path d="M40 14a20 20 0 1 1-22 6" fill="none" stroke="#45226b" stroke-width="9" stroke-linecap="round"/><path d="M40 14a20 20 0 1 1-22 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M8 14l14 2-4 14z" fill="#fff" stroke="#45226b" stroke-width="4" stroke-linejoin="round"/></svg></button></div>
  <div class="task" data-only="praise praise-awesome praise-great">
    <span class="say outlined">Rub the mud off</span>
    <div class="bar sky" data-only="praise-great"><i style="width:22%"></i></div>
    <div class="bar sky" data-only="praise-awesome"><i style="width:48%"></i></div>
    <div class="bar sky" data-only="praise"><i style="width:78%"></i></div>
  </div>
  <div class="tray" data-only="praise praise-awesome praise-great">
    <button class="slot sel" data-tap><span class="k">1</span><i data-ic="sponge"></i></button>
    <button class="slot" data-tap><span class="k">2</span><i data-ic="tweezers"></i></button>
    <button class="slot" data-tap><span class="k">3</span><i data-ic="shower"></i></button>
    <button class="slot" data-tap><span class="k">4</span><i data-ic="clipper"></i></button>
  </div>

  <!-- the praise: one word and the combo count, on the wash picture beside the cat -->
  <div class="scene" data-only="praise praise-awesome praise-great">
    <div class="praise great" data-only="praise-great"><span class="pw outlined">Great!</span><span class="px outlined"><small>x</small>3</span></div>
    <div class="praise awesome" data-only="praise-awesome"><span class="pw outlined">Awesome!</span><span class="px outlined"><small>x</small>7</span>
      <i data-ic="sparkle" class="s2"></i></div>
    <div class="praise spark" data-only="praise"><span class="pw outlined">Sparkling!</span><span class="px outlined"><small>x</small>12</span>
      <i data-ic="sparkle" class="s1"></i><i data-ic="sparkle" class="s2"></i><i data-ic="sparkle" class="s3"></i></div>
  </div>

  <div class="toasts">
    <div class="toast" data-only="toasts"><span class="med face"><span class="shot"><img src="img/Cat_Toffee_Sit.png" alt=""></span></span><span>Toffee added to your Index!</span></div>
    <!-- Suds is the helper from helpers.html: the same portrait and cap -->
    <div class="toast" data-only="toasts"><span class="med face"><span class="shot"><img src="img/Cat_Tux_Sit.png" alt=""><svg viewBox="0 0 256 256" aria-hidden="true"><polygon points="121.0,74.0 165.5,59.0 165.5,71.0 121.0,86.0" fill="#79c9ad"/><polygon points="37.5,58.0 121.0,74.0 121.0,86.0 37.5,70.0" fill="#a8e6cf"/><polygon points="37.5,58.0 121.0,74.0 121.0,77.0 37.5,61.0" fill="#ffffff"/><polygon points="121.0,74.0 165.5,59.0 165.5,62.0 121.0,77.0" fill="#dcefe8"/><polygon points="37.5,70.0 121.0,86.0 102.9,92.3 19.4,76.3" fill="#d2f7ea"/><polygon points="19.4,76.3 102.9,92.3 102.9,95.3 19.4,79.3" fill="#8ad6ba"/></svg></span></span><span>Suds finished a cat:</span><span class="gain">+30<i data-ic="coin"></i></span></div>
    <div class="toast" data-only="single"><span class="med"><i data-ic="jar"></i></span><span>Tip jar is full</span></div>
  </div>
</div></div>
<script src="kit.js"></script>
<script>
// narrow: the design width is under 1060, so two centred toasts would not fit between the HUD buttons and the level bar
(function () {
  // the thumbstick is hidden while washing, as in wash.html
  if ((document.body.dataset.state || '').startsWith('praise')) document.body.classList.add('no-move');
  function narrow() { document.body.classList.toggle('narrow', parseFloat(document.getElementById('stage').style.width) < 1060); }
  window.addEventListener('DOMContentLoaded', narrow);
  window.addEventListener('resize', narrow);
})();
</script>
</body>
</html>
